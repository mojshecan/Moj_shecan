name: update-sub

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sub
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install xray
        run: |
          curl -sL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q xray.zip xray
          sudo mv xray /usr/local/bin/xray
          xray version | head -1

      - name: Collect and test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collect.py

      - name: Commit result
        run: |
          git config user.name "sub-bot"
          git config user.email "sub-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "update $(date -u +%F\ %H:%M)" && git push)
